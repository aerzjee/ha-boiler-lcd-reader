name: Build & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  validate-version:
    name: Validate tag vs config.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from config.yaml
        id: config_version
        run: |
          VERSION=$(grep '^version:' config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: tag_version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        run: |
          if [ "${{ steps.config_version.outputs.version }}" != "${{ steps.tag_version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.tag_version.outputs.version }}) does not match config.yaml version (${{ steps.config_version.outputs.version }})"
            exit 1
          fi
          echo "Version match confirmed: ${{ steps.config_version.outputs.version }}"

  build:
    name: Build amd64 image
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --amd64 \
            --target . \
            --docker-hub ${{ env.REGISTRY }}/${{ github.repository_owner }}
